---
- name: Install the pinned Custom runtime
  block:
    - name: Allocate a private temporary directory for the runtime bundle
      ansible.builtin.tempfile:
        state: directory
        prefix: qlsm-runtime-
      register: custom_bundle_tmp

    - name: Copy the verified runtime bundle from the panel
      ansible.builtin.copy:
        src: "{{ custom_bundle_path }}"
        dest: "{{ custom_bundle_tmp.path }}/bundle.tar.gz"
        owner: root
        group: root
        mode: '0600'

    - name: Stage the operation fence helper for the release publisher
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/qlsm_runtime_op.py"
        dest: "{{ custom_bundle_tmp.path }}/fence.py"
        owner: root
        group: root
        mode: '0600'
      when: custom_action | default('') == 'stage'

    - name: Verify and publish the pinned runtime
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/../files/install_custom_runtime.py
          {{ (custom_bundle_tmp.path ~ '/bundle.tar.gz') | quote }} {{ custom_release_digest | quote }}
          {{ runtime_shared_dir | dirname | quote }} {{ custom_requirements_file | quote }}
          {{ custom_launch_script | quote }} {{ custom_dependency_imports | to_json | quote }}
          --platform {{ custom_platform | to_json | quote }}
          {% if custom_action | default('') == 'stage' %}
          --operation-fence {{ (custom_bundle_tmp.path ~ '/fence.py') | quote }}
          {{ operation_id | quote }} {{ fencing_token | int }}
          {% endif %}
        executable: /usr/bin/python3
  always:
    - name: Clean up the temporary runtime bundle
      ansible.builtin.file:
        path: "{{ custom_bundle_tmp.path }}"
        state: absent
      when: custom_bundle_tmp.path is defined
