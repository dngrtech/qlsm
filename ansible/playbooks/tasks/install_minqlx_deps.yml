---
# Shared task: install minqlx plugin Python dependencies.
# Requires: qlds_dir (e.g. /home/ql/qlds-27960), runtime_plugins_dirname
# Failure is non-blocking — a QLSM_PIP_WARN sentinel is emitted so callers can log it.
#
# NOTE: pip runs as root (inherited become: yes from the importing playbook). This is
# intentional and consistent with the existing pip block in add_qlds_instance.yml.
# Packages are installed system-wide, which matches current QLSM practice. If
# venv-per-instance support is ever needed, revisit this file and add_qlds_instance.yml
# together.
#
# Exception: an instance with an isolated dependency venv (python_deps_path, set by
# the runtime upgrade) installs into that venv through its own interpreter, as the
# ql user, never system-wide. The global branch below runs only when it is unset.

- name: Get pip3 version
  command: pip3 --version
  register: pip3_version_output
  changed_when: false
  failed_when: false
  when: python_deps_path | default('') | length == 0

- name: Check if requirements.txt exists in the runtime plugins directory
  ansible.builtin.stat:
    path: "{{ qlds_dir }}/{{ runtime_plugins_dirname }}/requirements.txt"
  register: minqlx_req_stat_result

# Upgraded hosts (Host.runtime_deps_isolated): build or refresh the instance's
# venv as ql -- core + the instance's synced requirements in ONE pip run, then
# pip check -- before any other pip. Never system pip on such a host. A pip
# failure only warns (QLSM_PIP_WARN) and the restart/apply/deploy goes on, as
# on legacy hosts; failing to create a missing venv still fails the play.
# A new-instance venv (instances/<id>) is keyed by an id SQLite can reuse after
# a delete. python_deps_owner (id + creation time) is recorded in the venv; a
# venv with a different or no marker is removed (a symlink is unlinked, never
# followed) and rebuilt by the ensure step below. Runs as ql, like every step
# under /home/ql.
- name: Require a new-instance venv path before claiming it
  ansible.builtin.assert:
    that:
      - python_deps_path is match('^/home/ql/runtime-deps/minqlxtended/instances/[0-9]+$')
    fail_msg: "Refusing to claim {{ python_deps_path }}: not a new-instance dependency venv."
    quiet: true
  when: python_deps_ensure | default(false) | bool and python_deps_owner | default('') | length > 0

- name: Claim the instance's venv (rebuild one left by a deleted instance)
  become: yes
  become_user: ql
  vars:
    python_deps_claim_py: |
      import os, shutil, sys
      path, owner = sys.argv[1], sys.argv[2]
      marker = os.path.join(path, '.qlsm-owner')
      state = 'claimed'
      if os.path.islink(path) or (os.path.lexists(path) and not os.path.isdir(path)):
          os.unlink(path)
          state = 'rebuilt'
      elif os.path.isdir(path):
          try:
              fd = os.open(marker, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(fd) as handle:
                  current = handle.read().strip()
          except OSError:
              current = None
          if current == owner:
              print('kept')
              sys.exit(0)
          shutil.rmtree(path)
          state = 'rebuilt'
      os.makedirs(path, mode=0o755)
      fd = os.open(marker, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o644)
      os.write(fd, owner.encode())
      os.close(fd)
      print(state)
  ansible.builtin.command:
    argv: [/usr/bin/python3, -c, "{{ python_deps_claim_py }}", "{{ python_deps_path }}", "{{ python_deps_owner }}"]
  register: python_deps_claim
  changed_when: python_deps_claim.stdout | trim != 'kept'
  when: python_deps_ensure | default(false) | bool and python_deps_owner | default('') | length > 0

- name: Ensure the instance's isolated dependency venv
  ansible.builtin.include_tasks: runtime_python_deps.yml
  vars:
    runtime_deps_dir: "{{ python_deps_path | dirname }}"
    runtime_deps_soft_fail: true
    runtime_instances:
      - id: "{{ python_deps_path | basename | int }}"
        requirements_src: ''
        remote_requirements: >-
          {{ (qlds_dir ~ '/' ~ runtime_plugins_dirname ~ '/requirements.txt')
             if minqlx_req_stat_result.stat.exists else '' }}
    core_requirements_src: "{{ python_deps_core_requirements_src | default('') }}"
  when: python_deps_ensure | default(false) | bool

- name: Install plugin Python deps from requirements.txt
  ansible.builtin.pip:
    requirements: "{{ qlds_dir }}/{{ runtime_plugins_dirname }}/requirements.txt"
    executable: pip3
    extra_args: "{{ '--break-system-packages' if (pip3_version_output.stdout.split()[1] is version('22.1', '>=')) else '' }}"
  when: python_deps_path | default('') | length == 0 and minqlx_req_stat_result.stat.exists and (pip3_version_output.rc | default(1)) == 0
  ignore_errors: yes
  register: pip_install_result

# The venv's core requirements (staged beside it by install_runtime.yml) go
# into the same pip run, so instance requirements cannot silently downgrade
# what the runtime needs; `pip check` then catches any remaining conflict.
- name: Check for the venv's captured core requirements
  ansible.builtin.stat:
    path: "{{ python_deps_path | dirname }}/core-requirements.txt"
  register: venv_core_req_stat
  when: python_deps_path | default('') | length > 0 and not (python_deps_ensure | default(false) | bool)

- name: Install plugin Python deps into the instance's isolated venv
  become: yes
  become_user: ql
  ansible.builtin.shell: >-
    {{ (python_deps_path ~ '/bin/python') | quote }} -m pip install
    --disable-pip-version-check --no-input
    {% if venv_core_req_stat.stat.exists %}-r {{ (python_deps_path | dirname ~ '/core-requirements.txt') | quote }}{% endif %}
    -r {{ (qlds_dir ~ '/' ~ runtime_plugins_dirname ~ '/requirements.txt') | quote }}
    && {{ (python_deps_path ~ '/bin/python') | quote }} -m pip check --disable-pip-version-check
  environment:
    PIP_CONFIG_FILE: /dev/null
    PYTHONNOUSERSITE: "1"
  # The ensure step above already installed into the venv on upgraded hosts.
  when: >-
    python_deps_path | default('') | length > 0 and minqlx_req_stat_result.stat.exists
    and not (python_deps_ensure | default(false) | bool)
  ignore_errors: yes
  register: venv_pip_install_result

- name: Warn if venv pip install failed
  ansible.builtin.debug:
    msg: "QLSM_PIP_WARN: pip install into {{ python_deps_path }} failed: {{ venv_pip_install_result.stderr | default(venv_pip_install_result.stdout | default('unknown error')) | truncate(200) }}"
  when: venv_pip_install_result is defined and venv_pip_install_result.failed | default(false)

- name: Warn if pip install failed
  ansible.builtin.debug:
    msg: "QLSM_PIP_WARN: pip install failed: {{ pip_install_result.stderr | default(pip_install_result.stdout | default('unknown error')) | truncate(200) }}"
  when: pip_install_result is defined and pip_install_result.failed | default(false)
