---
# Shared task (install_runtime.yml): one isolated venv per instance under
# {{ runtime_deps_root }}/minqlxtended/<operation_id>/<instance_id>/, built
# with the same interpreter the minqlxtended build links against, without
# system site-packages. Core and instance requirements are installed by ONE
# `pip install` (installing them one after the other would let the second
# silently downgrade the first), followed by `pip check`; either failing
# fails the play. Never system-wide pip, never --break-system-packages.
#
# runtime_deps_soft_fail (default false): set only by install_minqlx_deps.yml
# (restart/apply/deploy of an instance on an upgraded host). A failing
# `pip install` or `pip check` then emits a QLSM_PIP_WARN line and the play
# continues, as the legacy system-pip path does. Creating the venv and the
# interpreter/ABI checks stay fatal in every mode: without a working venv
# the instance cannot start at all. install_runtime.yml never sets it.
#
# Requires: operation_id (or runtime_deps_dir), runtime_instances
#           ([{"id": int, "requirements_src": controller path or "",
#             "remote_requirements": path on the host or "" (optional)}]),
#           core_requirements_src (controller path or "")

- name: Resolve the operation's dependency directory
  ansible.builtin.set_fact:
    # install_runtime.yml: the operation's dir. install_minqlx_deps.yml
    # (isolated hosts) passes runtime_deps_dir: the dir holding the venv.
    runtime_deps_op_dir: >-
      {{ runtime_deps_dir if runtime_deps_dir is defined
         else (runtime_deps_root | default('/home/ql/runtime-deps')) ~ '/minqlxtended/' ~ operation_id }}
    # Replace a file with stdin, refusing to follow a symlink at the target.
    runtime_write_stdin_py: >-
      import os, sys;
      fd = os.open(sys.argv[1], os.O_WRONLY | os.O_CREAT | os.O_TRUNC | os.O_NOFOLLOW, 0o644);
      os.write(fd, sys.stdin.buffer.read()); os.close(fd)

- name: Read the system interpreter version
  ansible.builtin.command:
    argv: [/usr/bin/python3, -c, "import sys; print('%d.%d' % sys.version_info[:2])"]
  register: runtime_python_abi
  changed_when: false

- name: Read the Python the minqlxtended build links against
  ansible.builtin.command:
    argv: [python3-config, --ldflags, --embed]
  register: runtime_python_ldflags
  changed_when: false

- name: Require the venv interpreter to match the engine's libpython
  ansible.builtin.assert:
    that:
      - ("-lpython" ~ runtime_python_abi.stdout | trim) in runtime_python_ldflags.stdout
    fail_msg: >-
      /usr/bin/python3 is {{ runtime_python_abi.stdout | trim }} but the engine links
      {{ runtime_python_ldflags.stdout | trim }}; dependency venvs would not match its ABI.
    quiet: true

# The venv tree belongs to ql, who runs (and pip-installs into) the venvs.
# Root-owned operation state lives in /var/lib/qlsm/runtime-ops instead.
# Every step under /home/ql runs AS ql (no root chown/copy there), so a
# symlink ql plants can only lead to paths ql could already write.
- name: Ensure the operation's dependency directories exist
  become: yes
  become_user: ql
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ runtime_deps_root | default('/home/ql/runtime-deps') }}"
    - "{{ runtime_deps_root | default('/home/ql/runtime-deps') }}/minqlxtended"
    - "{{ runtime_deps_op_dir }}"

# Written by ql via stdin (no root copy into the ql tree, and no remote temp
# file that an unprivileged become would need ACLs for).
- name: Stage the captured core requirements
  become: yes
  become_user: ql
  ansible.builtin.command:
    argv: [/usr/bin/python3, -c, "{{ runtime_write_stdin_py }}", "{{ runtime_deps_op_dir }}/core-requirements.txt"]
    stdin: "{{ lookup('ansible.builtin.file', core_requirements_src) }}"
  when: core_requirements_src | length > 0

- name: Stage each instance's captured requirements
  become: yes
  become_user: ql
  ansible.builtin.command:
    argv: [/usr/bin/python3, -c, "{{ runtime_write_stdin_py }}",
           "{{ runtime_deps_op_dir }}/{{ item.id | int }}.requirements.txt"]
    stdin: "{{ lookup('ansible.builtin.file', item.requirements_src) }}"
  loop: "{{ runtime_instances }}"
  loop_control:
    label: "{{ item.id }}"
  when: item.requirements_src | default('') | length > 0

- name: Create each instance's venv (no system site-packages)
  become: yes
  become_user: ql
  ansible.builtin.command:
    argv: [/usr/bin/python3, -m, venv, "{{ runtime_deps_op_dir }}/{{ item.id | int }}"]
    creates: "{{ runtime_deps_op_dir }}/{{ item.id | int }}/pyvenv.cfg"
  loop: "{{ runtime_instances }}"
  loop_control:
    label: "{{ item.id }}"

- name: Confirm each venv uses the engine's Python version
  become: yes
  become_user: ql
  ansible.builtin.command:
    argv: ["{{ runtime_deps_op_dir }}/{{ item.id | int }}/bin/python", -c,
           "import sys; print('%d.%d' % sys.version_info[:2], sys.prefix != sys.base_prefix)"]
  register: runtime_venv_versions
  changed_when: false
  failed_when: runtime_venv_versions.stdout | trim != (runtime_python_abi.stdout | trim) ~ ' True'
  loop: "{{ runtime_instances }}"
  loop_control:
    label: "{{ item.id }}"

- name: Install core and instance requirements together into each venv
  become: yes
  become_user: ql
  ansible.builtin.command:
    argv: >-
      {{ [runtime_deps_op_dir ~ '/' ~ (item.id | int) ~ '/bin/python', '-m', 'pip', 'install',
          '--disable-pip-version-check', '--no-input']
         + ((core_requirements_src | length > 0) | ternary(['-r', runtime_deps_op_dir ~ '/core-requirements.txt'], []))
         + ((item.requirements_src | default('') | length > 0)
            | ternary(['-r', runtime_deps_op_dir ~ '/' ~ (item.id | int) ~ '.requirements.txt'], []))
         + ((item.remote_requirements | default('') | length > 0)
            | ternary(['-r', item.remote_requirements | default('')], [])) }}
  environment:
    PIP_CONFIG_FILE: /dev/null
    PYTHONNOUSERSITE: "1"
  loop: "{{ runtime_instances }}"
  loop_control:
    label: "{{ item.id }}"
  when: >-
    core_requirements_src | length > 0 or item.requirements_src | default('') | length > 0
    or item.remote_requirements | default('') | length > 0
  ignore_errors: "{{ runtime_deps_soft_fail | default(false) | bool }}"
  register: runtime_venv_pip_install

- name: Verify each venv's dependencies are consistent
  become: yes
  become_user: ql
  ansible.builtin.command:
    argv: ["{{ runtime_deps_op_dir }}/{{ item.id | int }}/bin/python", -m, pip, check,
           --disable-pip-version-check]
  environment:
    PIP_CONFIG_FILE: /dev/null
    PYTHONNOUSERSITE: "1"
  changed_when: false
  loop: "{{ runtime_instances }}"
  loop_control:
    label: "{{ item.id }}"
  ignore_errors: "{{ runtime_deps_soft_fail | default(false) | bool }}"
  register: runtime_venv_pip_check

- name: Warn if a venv pip install failed
  ansible.builtin.debug:
    msg: "QLSM_PIP_WARN: pip install into {{ runtime_deps_op_dir }}/{{ item.item.id | int }} failed: {{ item.stderr | default(item.stdout | default('unknown error'), true) | truncate(200) }}"
  loop: "{{ runtime_venv_pip_install.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | list }}"
  loop_control:
    label: "{{ item.item.id }}"
  when: runtime_deps_soft_fail | default(false) | bool

- name: Warn if a venv pip check failed
  ansible.builtin.debug:
    msg: "QLSM_PIP_WARN: pip check in {{ runtime_deps_op_dir }}/{{ item.item.id | int }} failed: {{ item.stdout | default(item.stderr | default('unknown error'), true) | truncate(200) }}"
  loop: "{{ runtime_venv_pip_check.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | list }}"
  loop_control:
    label: "{{ item.item.id }}"
  when: runtime_deps_soft_fail | default(false) | bool
