---
# Shared task: build minqlxtended into {{ minqlxtended_shared_dir }}.
# Imported by setup_host.yml and rebuild_minqlx.yml (when runtime ==
# 'minqlxtended') and by install_runtime.yml, so every path installs the same
# engine. Never touches the minqlx shared directory.
#
# Requires: minqlx_build_dir, minqlxtended_git_repo, minqlxtended_git_version,
#           minqlxtended_shared_dir
# Optional: minqlxtended_patches (explicit file names under
#           ql-assets/patches/minqlxtended/; default ['qlsm-python-deps.patch',
#           'qlsm-demo-capture.patch']; never globbed)
#
# The minqlx C patches (ql-assets/patches/*.patch) are obsolete here: `damage`
# is a native event and reset_acc is pure Python. Two patches are applied:
# - qlsm-python-deps.patch lets a service point the embedded interpreter at an
#   isolated venv via QLSM_PYTHON_DEPS. It is a strict no-op when that variable
#   is unset. No PYTHONPATH either -- the .so locates minqlxtended.zip beside itself.
# - qlsm-demo-capture.patch is tjone270/minqlxtended PR #8 (server-side demo
#   capture) plus the one-line demo_cvars_ensure() fix from RemyTek's dev-branch
#   (eb926d84), as a diff against the pinned commit. When PR #8 is merged and the
#   pin moves past it, REMOVE it from the list: `patch --forward` would skip the
#   already-applied hunks, exit 1 and fail the build.

- name: Clean up old minqlxtended build directory
  ansible.builtin.file:
    path: "{{ minqlx_build_dir }}"
    state: absent

- name: Create fresh minqlxtended build directory
  ansible.builtin.file:
    path: "{{ minqlx_build_dir }}"
    state: directory
    owner: ql
    group: ql
    mode: '0755'

- name: Ensure minqlxtended shared directory exists
  ansible.builtin.file:
    path: "{{ minqlxtended_shared_dir }}"
    state: directory
    owner: ql
    group: ql
    mode: '0755'

- name: Clone minqlxtended repo as ql user
  become: yes
  become_user: ql
  ansible.builtin.git:
    repo: "{{ minqlxtended_git_repo }}"
    dest: "{{ minqlx_build_dir }}"
    version: "{{ minqlxtended_git_version }}"
    depth: 1

# A private, randomly named staging dir (0700, owned by the ql user that
# applies the patches) and an explicit patch list: nothing another local user
# drops into a shared /tmp path can reach the build.
- name: Create a private patch staging directory
  ansible.builtin.tempfile:
    state: directory
    prefix: qlsm-minqlxtended-patches-
  register: minqlxtended_patch_stage

- name: Restrict the patch staging directory to the ql user
  ansible.builtin.file:
    path: "{{ minqlxtended_patch_stage.path }}"
    state: directory
    owner: ql
    group: ql
    mode: '0700'

- name: Copy local minqlxtended patches to build host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../ql-assets/patches/minqlxtended/{{ item }}"
    dest: "{{ minqlxtended_patch_stage.path }}/{{ item }}"
    owner: ql
    group: ql
    mode: '0600'
  loop: "{{ minqlxtended_patches | default(['qlsm-python-deps.patch', 'qlsm-demo-capture.patch']) }}"

- name: Apply local minqlxtended patches
  become: yes
  become_user: ql
  ansible.builtin.command:
    argv:
      - patch
      - -p1
      - --forward
      - --reject-file=-
      - -i
      - "{{ minqlxtended_patch_stage.path }}/{{ item }}"
    chdir: "{{ minqlx_build_dir }}"
  loop: "{{ minqlxtended_patches | default(['qlsm-python-deps.patch', 'qlsm-demo-capture.patch']) }}"

- name: Compile minqlxtended (make) as ql user
  become: yes
  become_user: ql
  community.general.make:
    chdir: "{{ minqlx_build_dir }}"

- name: Copy minqlxtended compiled files to shared location
  ansible.builtin.copy:
    src: "{{ minqlx_build_dir }}/{{ item.src }}"
    dest: "{{ minqlxtended_shared_dir }}/{{ item.dest }}"
    remote_src: yes
    owner: ql
    group: ql
    mode: '0755'
  loop:
    - { src: "bin/minqlxtended.x64.so", dest: "minqlxtended.x64.so" }
    - { src: "bin/minqlxtended.zip", dest: "minqlxtended.zip" }
    - { src: "bin/run_server_x64_minqlxtended.sh", dest: "run_server_x64_minqlxtended.sh" }

- name: Clean up minqlxtended build directory
  ansible.builtin.file:
    path: "{{ minqlx_build_dir }}"
    state: absent

- name: Clean up minqlxtended patch staging directory
  ansible.builtin.file:
    path: "{{ minqlxtended_patch_stage.path }}"
    state: absent
  when: minqlxtended_patch_stage.path is defined
