---
# Manual maintenance playbook — not wired into the QLSM UI/task queue.
# Run directly, e.g.:
#   ansible-playbook -i ansible/inventory/<host>.yml ansible/playbooks/rebuild_minqlx.yml \
#     -e '{"runtime": "minqlxtended-patched"}'
- name: Rebuild engine hook and deploy to shared location
  hosts: all
  become: yes
  gather_facts: false

  vars:
    minqlx_build_dir: "/tmp/minqlx-build"
    minqlx_shared_dir: "/home/ql/minqlx-shared"

  tasks:
    - name: Build/fetch engine hook
      include_tasks: tasks/build_engine_hook.yml
