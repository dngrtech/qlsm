---
# Deploys/configures/removes the ql-watchdog addon on a host.
#
# ql-watchdog detects a hung QLDS main-thread (kernel Recv-Q on the game UDP
# port stays high because the frame-loop stopped draining it) or an engine that
# crashed without exiting (no reply on the game port and no live-status key)
# and restarts only the affected qlds@<port>.service instance via systemctl - see
# ansible/files/ql-watchdog/watchdog.py for the detection/restart logic.
#
# Called with -e watchdog_enabled=true|false (+ optional tunables) by
# ui/task_logic/ansible_watchdog.py. When watchdog_enabled is false, the
# systemd unit is stopped/disabled/removed but the deployed script is left in
# place (cheap to re-enable later, mirrors configure_auto_restart.yml).
- name: Configure ql-watchdog addon
  hosts: all
  become: yes
  gather_facts: no

  vars:
    watchdog_dir: /opt/ql-watchdog
    watchdog_state_dir: /var/lib/qlsm/watchdog

  tasks:
    - name: Ensure ql-watchdog install directory exists
      ansible.builtin.file:
        path: "{{ watchdog_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: watchdog_enabled | default(false)

    - name: Ensure ql-watchdog state directory exists
      ansible.builtin.file:
        path: "{{ watchdog_state_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: watchdog_enabled | default(false)

    - name: Deploy ql-watchdog script
      ansible.builtin.copy:
        src: ../files/ql-watchdog/watchdog.py
        dest: "{{ watchdog_dir }}/watchdog.py"
        owner: root
        group: root
        mode: '0755'
      when: watchdog_enabled | default(false)

    # The forensics toggle is exposed in the UI and defaults on, so the tools
    # it promises have to actually exist on the host -- without this the
    # watchdog writes a "gdb not found" stub instead of a backtrace.
    - name: Install forensics tooling for ql-watchdog
      ansible.builtin.apt:
        name: gdb
        state: present
        update_cache: yes
        cache_valid_time: 3600
      when:
        - watchdog_enabled | default(false)
        - watchdog_forensics | default(true)

    - name: Render ql-watchdog systemd unit
      ansible.builtin.template:
        src: ../templates/ql-watchdog.service.j2
        dest: /etc/systemd/system/ql-watchdog.service
        owner: root
        group: root
        mode: '0644'
      when: watchdog_enabled | default(false)

    - name: Reload systemd daemon (ql-watchdog unit deployed)
      ansible.builtin.systemd:
        daemon_reload: yes
      when: watchdog_enabled | default(false)

    - name: Enable and (re)start ql-watchdog
      ansible.builtin.systemd:
        name: ql-watchdog
        state: restarted
        enabled: yes
      when: watchdog_enabled | default(false)

    # Tolerate only "the unit was never installed"; a genuine stop failure must
    # not be swallowed, or the unit file gets removed underneath a still-running
    # root daemon that retains systemctl restart authority over every qlds@ unit.
    - name: Stop and disable ql-watchdog
      ansible.builtin.systemd:
        name: ql-watchdog
        state: stopped
        enabled: no
      when: not (watchdog_enabled | default(false))
      register: watchdog_stop_result
      failed_when:
        - watchdog_stop_result is failed
        - "'could not be found' not in (watchdog_stop_result.msg | default(''))"

    - name: Remove ql-watchdog systemd unit file
      ansible.builtin.file:
        path: /etc/systemd/system/ql-watchdog.service
        state: absent
      when: not (watchdog_enabled | default(false))
      register: watchdog_unit_removed

    - name: Reload systemd daemon (ql-watchdog unit removed)
      ansible.builtin.systemd:
        daemon_reload: yes
      when: watchdog_unit_removed.changed | default(false)
