# Multi-agent PR review: parallel finders (coverage) -> one verifier (precision).
# Prompts load from the base branch; fork PRs are skipped (see triage).
# Prompts live in .github/review-prompts/. Keep the workflow name and the
# github-actions[bot] review it posts: local skills (assess-review,
# auto-pr-merge, review-pr) depend on both.
name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: true

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

env:
  PR: ${{ github.event.pull_request.number || inputs.pr }}

jobs:
  triage:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    permissions:
      contents: read
      pull-requests: write
    outputs:
      skip: ${{ steps.t.outputs.skip }}
      lenses: ${{ steps.t.outputs.lenses }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick reviewers
        id: t
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "PR must be a number, got: $PR"; exit 1; }
          # Fork PRs would run untrusted code next to the OAuth token on a manual
          # dispatch (and get no secrets on pull_request anyway), so skip them.
          if [ "$(gh pr view "$PR" --json isCrossRepository -q .isCrossRepository)" = "true" ]; then
            echo "::notice::PR #$PR is from a fork; Claude review skipped."
            echo "skip=fork" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh pr checkout "$PR"
          BASE=$(gh pr view "$PR" --json baseRefName -q .baseRefName)
          git fetch origin "$BASE"
          FILES=$(git diff --name-only "origin/$BASE...HEAD")
          CODE=$(echo "$FILES" | grep -vE '^(docs/|README\.md$|VERSION$)' || true)
          if [ -z "$CODE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo 'lenses=["correctness","conventions","security"]' >> "$GITHUB_OUTPUT"

      - name: Post skip notice for docs-only PRs
        if: steps.t.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr review "$PR" --comment --body "## Claude Code Review

          **Verdict:** Not reviewed

          Docs-only change (docs/, README.md, VERSION), so the code review was skipped. This is not an approval."

  find:
    needs: triage
    if: needs.triage.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lens: ${{ fromJSON(needs.triage.outputs.lenses) }}
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr checkout "$PR"
          BASE=$(gh pr view "$PR" --json baseRefName -q .baseRefName)
          git fetch origin "$BASE"
          echo "PR_BASE=origin/$BASE" >> "$GITHUB_ENV"
          # Prompts come from the base branch, never the PR, and any agent
          # config the PR adds is dropped before Claude starts.
          mkdir -p .review-prompts-base
          git archive "origin/$BASE" .github/review-prompts | tar -x -C .review-prompts-base --strip-components=2
          rm -rf .claude CLAUDE.md .mcp.json

      - name: Find issues (${{ matrix.lens }})
        id: find
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: |
            Read `.review-prompts-base/_shared.md` and then
            `.review-prompts-base/${{ matrix.lens }}.md`, and follow them.
            The change under review is PR #${{ env.PR }}:
            `git diff ${{ env.PR_BASE }}...HEAD`
          claude_args: >-
            --model claude-sonnet-5-5 --effort high --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*)"
            --json-schema '{"type":"object","required":["findings"],"properties":{"findings":{"type":"array","items":{"type":"object","required":["file","line","title","failure_scenario","evidence","severity","confidence"],"properties":{"file":{"type":"string"},"line":{"type":"integer"},"title":{"type":"string"},"failure_scenario":{"type":"string"},"evidence":{"type":"string"},"severity":{"type":"string","enum":["critical","high","medium","low"]},"confidence":{"type":"number"}}}}}}'

      - name: Save findings
        env:
          OUT: ${{ steps.find.outputs.structured_output }}
        run: |
          mkdir -p findings
          printf '%s' "$OUT" > "findings/${{ matrix.lens }}.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(len(d['findings']), 'findings')" "findings/${{ matrix.lens }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: findings-${{ matrix.lens }}
          path: findings/
          retention-days: 7

  judge:
    needs: [triage, find]
    if: always() && needs.triage.outputs.skip == 'false' && needs.find.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr checkout "$PR"
          BASE=$(gh pr view "$PR" --json baseRefName -q .baseRefName)
          git fetch origin "$BASE"
          # Same as the finders: base-branch prompts, no PR-supplied agent config.
          mkdir -p .review-prompts-base
          git archive "origin/$BASE" .github/review-prompts | tar -x -C .review-prompts-base --strip-components=2
          rm -rf .claude CLAUDE.md .mcp.json

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: findings-*
          path: findings
          merge-multiple: true

      - name: Verify findings and post review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          # The judge already filtered findings; post its inline comments as-is.
          classify_inline_comments: "false"
          prompt: |
            PR #${{ env.PR }} in ${{ github.repository }}.
            Follow `.review-prompts-base/judge.md`. The finders' output is in `findings/*.json`.
            Finders that were scheduled: ${{ needs.triage.outputs.lenses }}.
            A scheduled finder with no file failed; name it in the review footer.
          claude_args: >-
            --model claude-opus-5-5 --effort high --max-turns 50
            --allowedTools "Read,Glob,Grep,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
